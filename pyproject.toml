[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "absolute-deviation-regression"
version = "0.1.0"
description = "Reproducible outlier analysis and least-absolute-deviation regression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "seaborn>=0.12",
]

[project.scripts]
analyze-outliers = "outlier_analysis.pipeline:main"
validate-lad = "outlier_analysis.lad_validation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
