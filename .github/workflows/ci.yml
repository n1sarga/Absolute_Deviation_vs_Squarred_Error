name: Tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Update notebook metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("notebooks/absolute_deviation_full_workflow.ipynb")
          notebook = json.loads(path.read_text())

          replacements = {
              '["SSE", "SAE", "MAE", "RMSE"]': '["SSE", "SAE"]',
              '["coefficient_shift_l2", "prediction_shift_mae"]': '["coefficient_shift_l2"]',
              '["coefficient_error_l2", "SSE", "SAE", "MAE", "RMSE"]': '["coefficient_error_l2", "SSE", "SAE"]',
          }

          for cell in notebook.get("cells", []):
              source = cell.get("source")
              if isinstance(source, list):
                  for index, line in enumerate(source):
                      for old, new in replacements.items():
                          line = line.replace(old, new)
                      source[index] = line

          path.write_text(json.dumps(notebook, indent=1) + "\n")
          PY
          rm -f outputs/figures/mae_vs_contamination.png
          rm -f outputs/figures/rmse_vs_contamination.png

      - name: Execute complete notebook
        run: |
          python -m nbconvert --to notebook --execute --inplace notebooks/absolute_deviation_full_workflow.ipynb \
            --ExecutePreprocessor.timeout=900 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Commit generated notebook and outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/ outputs/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Execute complete LAD notebook and refresh outputs [skip ci]"
            git push
          fi
