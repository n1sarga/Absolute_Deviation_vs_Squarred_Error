name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Run analysis workflow
        run: python scripts/analyze_outliers.py

      - name: Validate LAD solver
        run: python scripts/validate_lad.py

      - name: Fit OLS and LAD baselines
        run: python scripts/fit_baseline_models.py

      - name: Run robustness experiments
        run: python scripts/run_robustness_experiments.py

      - name: Evaluate OLS and LAD
        run: python scripts/evaluate_models.py

      - name: Run final validation
        run: python scripts/run_final_analysis.py
